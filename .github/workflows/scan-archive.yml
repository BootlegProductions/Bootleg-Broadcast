name: Scan supplied Archive collections
on:
  push:
    paths:
      - '.github/workflows/scan-archive.yml'
      - 'tools/scan_archive_inbox.py'
      - 'tools/summarize_archive_review.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Archive item file listings and bundles
        run: python tools/scan_archive_inbox.py --inspect-bundles --limit 30
      - name: Write compact Christmas and family film review
        run: python tools/summarize_archive_review.py
      - name: Commit candidate inventories for review
        run: |
          git config user.name "Bootleg Broadcast Review"
          git config user.email "actions@users.noreply.github.com"
          git add archive-christmas-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Inventory actual Archive Christmas and film file candidates"
            git push
          fi
