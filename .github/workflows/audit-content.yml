name: Audit channel films and Christmas content
on:
  push:
    paths:
      - '.github/workflows/audit-content.yml'
      - 'tools/audit_channel_content.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit source catalogue and compiled winter schedules
        run: python tools/audit_channel_content.py
      - name: Save compact content audit
        run: |
          git config user.name "Bootleg Broadcast Audit"
          git config user.email "actions@users.noreply.github.com"
          git add channel-content-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record channel catalogue and movie scheduling audit"
            git push
          fi
