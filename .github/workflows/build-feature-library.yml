name: Build complete channel film and Christmas catalogue
on:
  push:
    paths:
      - '.github/workflows/build-feature-library.yml'
      - 'tools/build_channel_feature_library.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build browse library and counts from full source catalogue
        run: python tools/build_channel_feature_library.py
      - name: Commit generated channel listings
        run: |
          git config user.name "Bootleg Broadcast Library"
          git config user.email "actions@users.noreply.github.com"
          git add channel-feature-library.js channel-feature-library-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Populate complete channel film and Christmas browse library"
            git push
          fi
