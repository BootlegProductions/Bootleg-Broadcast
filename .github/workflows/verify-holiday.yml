name: Verify Christmas channel library
on:
  push:
    paths:
      - '.github/workflows/verify-holiday.yml'
      - 'tools/verify_holiday_broadcast.cjs'
      - 'tools/probe_holiday_links.py'
      - 'holiday-programmes.js'
      - 'broadcast-clock.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check December broadcast additions and duplicate sources
        run: node tools/verify_holiday_broadcast.cjs
      - name: Check sample Archive file URLs without downloading video
        run: python tools/probe_holiday_links.py
      - name: Save validation report
        run: |
          git config user.name "Bootleg Broadcast Verification"
          git config user.email "actions@users.noreply.github.com"
          git add holiday-broadcast-validation.json holiday-link-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Record validated December holiday channel airings"
            git push
          fi
