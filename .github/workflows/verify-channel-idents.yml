name: Verify retro channel ident rotation
on:
  push:
    paths:
      - '.github/workflows/verify-channel-idents.yml'
      - 'tools/verify_channel_idents.cjs'
      - 'broadcast-clock.js'
      - 'channel-idents.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check channel idents and continuity against real broadcast schedules
        run: node tools/verify_channel_idents.cjs
      - name: Run annual continuity tests
        run: node tools/verify_continuity.cjs
      - name: Save ident rotation validation
        run: |
          git config user.name "Bootleg Broadcast Validation"
          git config user.email "actions@users.noreply.github.com"
          git add channel-ident-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified hourly Nickelodeon and Boomerang ident rotation"
            git push
          fi
