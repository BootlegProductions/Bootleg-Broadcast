name: Build channel Archive additions shortlist
on:
  push:
    paths:
      - 'tools/prepare_archive_additions.cjs'
      - '.github/workflows/prepare-archive-additions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check and shortlist Archive media against existing programme catalogue
        run: node tools/prepare_archive_additions.cjs
      - name: Commit metadata-only shortlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive-curated-additions.json ARCHIVE-CHANNEL-ADDITIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Shortlist Archive films and specials by broadcast channel"
            git push origin HEAD:main
          fi
